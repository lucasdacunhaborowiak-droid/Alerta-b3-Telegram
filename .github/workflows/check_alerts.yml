          elif [ "${{ github.event.schedule }}" = "10 13 * * 1-5" ]; then
            echo "value=open" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "55 20 * * 1-5" ]; then
            echo "value=close" >> "$GITHUB_OUTPUT"
          else
            echo "value=alerts" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          # Chat atual: abertura/fechamento.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Novo grupo: alertas de compra.
          TELEGRAM_BUY_CHAT_ID: ${{ secrets.TELEGRAM_BUY_CHAT_ID }}

          # Opcional por enquanto. Quando você criar esse Secret,
          # as vendas passarão automaticamente para o grupo separado.
          TELEGRAM_SELL_CHAT_ID: ${{ secrets.TELEGRAM_SELL_CHAT_ID }}

          BOT_MODE: ${{ steps.mode.outputs.value }}

        run: python price_alert_bot.py

      - name: Salvar alerts.json (se houver mudanças)
        if: steps.mode.outputs.value != 'test'
        shell: bash
        run: |
          if git diff --quiet -- alerts.json; then
            echo "Nenhuma alteração em alerts.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alerts.json
          git commit -m "Atualiza alerts.json (modo: ${{ steps.mode.outputs.value }})"

          # Tenta incorporar mudanças remotas sem sobrescrever o arquivo.
          git pull --rebase origin "${{ github.ref_name }}"
          git push
